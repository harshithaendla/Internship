<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <!-- Name -->
        <label for="fullname">Name:</label><br>
        <input type="text" placeholder="Enter your name" id="fullname" required answer="fullname"><br>
        <!-- Email -->
        <label for="email">Email address:</label><br>
        <input type="email" placeholder="Enter your email " id="email" required emailaddress="email"><br>
        <!-- Password -->
        <label for="psw">Password:</label><br>
        <input type="password" placeholder="Enter your password" minlength="8" id="psw" required password="psw"><br>
        <!-- Age -->
        <label for="Age">Age:</label>
        <input type="number" id="age" age="age" min="18" max="60"><br>
        <!-- Radio button -->
         <p> Gender </p>
         <input type="radio" id="male" name="gender">
         <label for="male">Male</label>
         <input type="radio" id="female" name="gender">
         <label for="female">Female</label><br>
         <!-- checkbox -->
          <input type="checkbox" id="html" name="html">
          <label for="html">HTML</label>
          <!-- dropdown -->
        <!-- message -->
         <!-- Resume upload -->
          <label for="resume">Upload resume</label><br>
          <input type="file" name="resume" id="resume"><br>
          <!-- date picker -->
           <label for="dob">Dte of birth</label>
           <input type="date" name="dob" id="dob"><br>
           <!-- Button  -->
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
           </form>
    
</body>
</html>
