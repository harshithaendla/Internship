<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .active{
            color: white; }
        .hidden{
            display: none;
        }
        .dark{
            background-color: black;
        }


    </style>
</head>
<body>
    <h1 class="heading">Javascript DOM</h1>
    <script>
        let ruas=document.querySelector("h1")
        ruas.classList.add("dark")
        console.log(ruas.className);
        ruas.classList.remove("dark")
        ruas.classList.toggle("dark")
    </script>
</body>
</html>
