<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            display: grid;
            grid-template-columns:repeat(3,1fr);
        }

        .child{
            background-color: blue;
            gap: 20px;
            margin: 2px;
            padding: 20px;
            justify-content: center;
            text-align: center;
        }


    </style>
</head>
<body>
    <div class="parent">
        <div class="child" id="box1">1</div>
        <div class="child" id="box2">2</div>
        <div class="child" id="box3">3</div>
        <div class="child" id="box4">4</div>
        <div class="child" id="box5">5</div>
        <div class="child" id="box6">6</div>
        <div class="child" id="box7">7</div>

    </div>
</body>
</html>
