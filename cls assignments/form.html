<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration form</title>
</head>
<body>
    <form action="">
        <!-- Name -->
        <label for="fullname">Name:</label><br>
        <input type="text" placeholder="Enter your name" id="fullname" required answer="fullname"><br>
        <!-- Email -->
        <label for="email">Email address:</label><br>
        <input type="email" placeholder="Enter your email " id="email" required emailaddress="email"><br>
        <!-- Password -->
        <label for="psw">Password:</label><br>
        <input type="password" placeholder="Enter your password" minlength="8" id="psw" required password="psw"><br>
        <!-- Age -->
        <label for="age">Age:</label>
        <input type="number" id="age" age="age" min="18" max="60"><br>
        <!-- Radio button -->
         <label for="gender">Gender:</label>
         <input type="radio" id="gender" name="gender" value="male">
         <label for="gender">Male</label>
         <input type="radio" id="gender" name="gender" value="female">
         <label for="gender">Female</label><br>
         <!-- checkbox -->
          <label for="tech">Technologies you know</label>
          <input type="checkbox" id="tech" name="tech" value="HTML">
          <label for="tech">HTML</label>
          <input type="checkbox" id="tech" name="tech" value="CSS">
          <label for="tech">CSS</label>
          <input type="checkbox" id="tech" name="tech" value="Javascript">
          <label for="tech">Javascript</label>
          <br>
          <!-- dropdown -->
           <label for="country">Country</label>
           <select name="country" id="country">
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="germany">Germany</option>
            <option value="other">Other</option>
           </select>
        <!-- Textarea -->
         <br><label for="msg">Message</label>
         <textarea name="msg" id="msg"></textarea>
         <!-- Resume upload -->
         <br> <label for="resume">Upload resume</label><br>
          <input type="file" name="resume" id="resume"><br>
          <!-- date picker -->
           <label for="dob">Date of birth</label>
           <input type="date" name="dob" id="dob"><br>
           <!-- Button  -->
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
           </form>
    
</body>
</html>
